<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Sacred Pooja Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0205;
      color: #ffd000;
      font-family: 'Georgia', serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    #ui-container {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 15px;
      background: rgba(40, 0, 10, 0.85);
      padding: 12px 25px;
      border: 2px solid #ffb703;
      border-radius: 50px;
      box-shadow: 0 0 25px rgba(255, 183, 3, 0.4);
      z-index: 10;
    }
    .pooja-btn {
      background: #4a0011;
      border: 1px solid #ffb703;
      color: #ffe6a7;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pooja-btn:hover {
      background: #ffb703;
      color: #2b000a;
      transform: translateY(-2px);
    }
    #banner {
      position: absolute;
      top: 20px;
      background: rgba(20, 0, 5, 0.9);
      border: 2px solid #ffb703;
      padding: 10px 25px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      z-index: 10;
      box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
    }
  </style>
  <!-- Load Three.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="banner">✨ 3D Interactive Pooja Simulator ✨</div>
<div id="canvas-container"></div>

<div id="ui-container">
  <button class="pooja-btn" onclick="offerPasupu()">🟡 Pasupu</button>
  <button class="pooja-btn" onclick="offerKumkum()">🔴 Kumkum</button>
  <button class="pooja-btn" onclick="offerFlowers()">🌸 Flowers</button>
  <button class="pooja-btn" onclick="lightAgarbathi()">🪔 Agarbathi</button>
  <button class="pooja-btn" onclick="offerCoconut()">🥥 Coconut</button>
</div>

<script>
// --- THREE.JS SCENE SETUP ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0205);
scene.fog = new THREE.FogExp2(0x0d0205, 0.03);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 3, 8);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// --- LIGHTING ---
const ambientLight = new THREE.AmbientLight(0xffecd1, 0.6);
scene.add(ambientLight);

const warmPointLight = new THREE.PointLight(0xffa500, 2, 10);
warmPointLight.position.set(0, 3, 2);
warmPointLight.castShadow = true;
scene.add(warmPointLight);

// --- 3D ENVIRONMENT & ALTAR ---
// Altar Base
const altarGeo = new THREE.CylinderGeometry(2.5, 2.8, 0.6, 32);
const altarMat = new THREE.MeshStandardMaterial({ color: 0x4a0a18, roughness: 0.4, metalness: 0.2 });
const altar = new THREE.Mesh(altarGeo, altarMat);
altar.position.y = 0.3;
altar.receiveShadow = true;
scene.add(altar);

// Pedestal for Idol
const pedestalGeo = new THREE.BoxGeometry(1.2, 0.4, 1.2);
const pedestalMat = new THREE.MeshStandardMaterial({ color: 0xffb703, metalness: 0.8, roughness: 0.2 });
const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
pedestal.position.set(0, 0.8, 0);
pedestal.castShadow = true;
scene.add(pedestal);

// --- 3D IDOL (Ganesha Stylized Mesh) ---
const idolGroup = new THREE.Group();

const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.2 });

// Body
const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), goldMat);
body.position.y = 1.4;
idolGroup.add(body);

// Head
const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), goldMat);
head.position.y = 2.1;
idolGroup.add(head);

// Trunk
const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.03, 0.5, 16), goldMat);
trunk.position.set(0, 1.9, 0.3);
trunk.rotation.x = Math.PI / 4;
idolGroup.add(trunk);

// Crown (Mukut)
const crown = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.5, 16), goldMat);
crown.position.y = 2.6;
idolGroup.add(crown);

scene.add(idolGroup);

// Aura Glow Ring
const auraGeo = new THREE.RingGeometry(0.6, 1.2, 32);
const auraMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
const aura = new THREE.Mesh(auraGeo, auraMat);
aura.position.set(0, 2.1, -0.1);
scene.add(aura);

// --- OFFERING ACTIONS ---
let smokeParticles = [];
let agarbathiLit = false;

// 1. Pasupu (Turmeric Mark)
function offerPasupu() {
  const mark = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd700 })
  );
  mark.position.set(0, 2.2, 0.35);
  scene.add(mark);
}

// 2. Kumkum (Vermilion Mark)
function offerKumkum() {
  const mark = new THREE.Mesh(
    new THREE.SphereGeometry(0.03, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xd90429 })
  );
  mark.position.set(0, 2.23, 0.37);
  scene.add(mark);
}

// 3. Flowers
function offerFlowers() {
  const colors = [0xff70a6, 0xffb703, 0xffffff];
  for (let i = 0; i < 6; i++) {
    const flower = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.08),
      new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] })
    );
    flower.position.set(
      (Math.random() - 0.5) * 1.5,
      0.65,
      (Math.random() - 0.5) * 1.2 + 0.3
    );
    scene.add(flower);
  }
}

// 4. Agarbathi (Incense & Smoke System)
function lightAgarbathi() {
  if (agarbathiLit) return;
  agarbathiLit = true;

  // Stand and Stick
  const stick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.01, 0.01, 0.6),
    new THREE.MeshBasicMaterial({ color: 0x5c4033 })
  );
  stick.position.set(0.8, 0.8, 0.5);
  scene.add(stick);

  const tip = new THREE.Mesh(
    new THREE.SphereGeometry(0.02),
    new THREE.MeshBasicMaterial({ color: 0xff3300 })
  );
  tip.position.set(0.8, 1.1, 0.5);
  scene.add(tip);
}

// 5. Coconut
function offerCoconut() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x6b4226, roughness: 0.9 });
  const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });

  // Two halves
  const half1 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat);
  half1.position.set(-0.6, 0.65, 0.6);
  half1.rotation.x = Math.PI;

  const inner1 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), whiteMat);
  inner1.position.set(-0.6, 0.66, 0.6);
  inner1.rotation.x = Math.PI;

  scene.add(half1);
  scene.add(inner1);
}

// --- ANIMATION LOOP ---
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Gentle Idol Breathing Motion
  idolGroup.position.y = Math.sin(time * 2) * 0.02;
  aura.rotation.z = time * 0.2;

  // Agarbathi Smoke Generation
  if (agarbathiLit && Math.random() < 0.4) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.02 + Math.random() * 0.02),
      new THREE.MeshBasicMaterial({ color: 0xcccccc, transparent: true, opacity: 0.4 })
    );
    p.position.set(0.8 + (Math.random() - 0.5) * 0.05, 1.1, 0.5);
    scene.add(p);
    smokeParticles.push(p);
  }

  // Animate Smoke Particles
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    const p = smokeParticles[i];
    p.position.y += 0.012;
    p.position.x += Math.sin(time * 3 + i) * 0.003;
    p.material.opacity -= 0.004;

    if (p.material.opacity <= 0) {
      scene.remove(p);
      smokeParticles.splice(i, 1);
    }
  }

  renderer.render(scene, camera);
}

// Responsive Resizing
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
