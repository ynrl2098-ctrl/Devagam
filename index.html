<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Sacred Pooja</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #120006;
      color: #ffe6a7;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #ffb703;
      box-shadow: 0 0 35px rgba(255, 183, 3, 0.4);
      border-radius: 12px;
      overflow: hidden;
      background: #2b000a;
    }
    canvas { display: block; cursor: pointer; }
    .instructions {
      margin-top: 10px;
      font-size: 14px;
      color: #ffb703;
      text-align: center;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="550" height="680"></canvas>
</div>
<div class="instructions">Click or drag items from the thali at the bottom to perform the pooja</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Game States
let activeItem = null;
let flowers = [];
let pasupuMarks = [];
let kumkumMarks = [];
let isAgarbathiLit = false;
let smokeParticles = [];
let isCoconutOffered = false;
let poojaComplete = false;

// Tool Items on the Pooja Thali
const tools = [
  { id: 'pasupu', name: 'Pasupu', icon: '🟡', x: 70, y: 610, radius: 28, color: '#ffd000' },
  { id: 'kumkum', name: 'Kumkum', icon: '🔴', x: 160, y: 610, radius: 28, color: '#d90429' },
  { id: 'flowers', name: 'Flowers', icon: '🌸', x: 250, y: 610, radius: 28, color: '#ff70a6' },
  { id: 'agarbathi', name: 'Agarbathi', icon: '🪔', x: 340, y: 610, radius: 28, color: '#ffb703' },
  { id: 'coconut', name: 'Coconut', icon: '🥥', x: 430, y: 610, radius: 28, color: '#9c6644' }
];

// Interaction Handlers
let isDragging = false;
let mouseX = 0, mouseY = 0;

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', (e) => handleStart(e.touches[0]));
canvas.addEventListener('touchmove', (e) => handleMove(e.touches[0]));
canvas.addEventListener('touchend', handleEnd);

function handleStart(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  tools.forEach(tool => {
    const dist = Math.hypot(x - tool.x, y - tool.y);
    if (dist < tool.radius) {
      activeItem = tool.id;
      isDragging = true;
    }
  });
}

function handleMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
}

function handleEnd() {
  if (isDragging && activeItem) {
    applyOffering(mouseX, mouseY);
  }
  isDragging = false;
  activeItem = null;
}

function applyOffering(x, y) {
  // Target Area: Near God Idol (Center Canvas)
  if (y < 500) {
    if (activeItem === 'pasupu') {
      pasupuMarks.push({ x, y, radius: 8 });
    } else if (activeItem === 'kumkum') {
      kumkumMarks.push({ x, y, radius: 6 });
    } else if (activeItem === 'flowers') {
      for (let i = 0; i < 5; i++) {
        flowers.push({
          x: x + (Math.random() * 40 - 20),
          y: Math.min(480, y + (Math.random() * 30 - 15)),
          type: Math.random() < 0.5 ? '🌸' : '🌼'
        });
      }
    } else if (activeItem === 'agarbathi') {
      isAgarbathiLit = true;
    } else if (activeItem === 'coconut') {
      isCoconutOffered = true;
    }
    checkCompletion();
  }
}

function checkCompletion() {
  if (pasupuMarks.length > 0 && kumkumMarks.length > 0 && flowers.length > 0 && isAgarbathiLit && isCoconutOffered) {
    poojaComplete = true;
  }
}

// Drawing Functions
function drawBackground() {
  // Sacred Arch / Mantap
  ctx.fillStyle = '#4a0011';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Pillars
  ctx.fillStyle = '#ffb703';
  ctx.fillRect(30, 80, 25, 420);
  ctx.fillRect(canvas.width - 55, 80, 25, 420);

  // Top Arch
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 90, 220, Math.PI, 0);
  ctx.fillStyle = '#ffb703';
  ctx.fill();

  ctx.fillStyle = '#2b000a';
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 90, 190, Math.PI, 0);
  ctx.fill();
}

function drawIdol() {
  ctx.save();
  ctx.translate(canvas.width / 2, 260);

  // Divine Aura Glow
  let auraGlow = ctx.createRadialGradient(0, 0, 20, 0, 0, 150);
  auraGlow.addColorStop(0, 'rgba(255, 215, 0, 0.6)');
  auraGlow.addColorStop(1, 'rgba(255, 215, 0, 0)');
  ctx.fillStyle = auraGlow;
  ctx.beginPath();
  ctx.arc(0, 0, 150, 0, Math.PI * 2);
  ctx.fill();

  // Divine Idol (Ganesha Representation)
  ctx.fillStyle = '#c97a2b'; // Brass/Stone finish

  // Base Pedestal
  ctx.fillRect(-70, 140, 140, 20);

  // Body & Head
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐘', 0, 0);

  ctx.restore();
}

function drawOfferings() {
  // Render Pasupu
  pasupuMarks.forEach(m => {
    ctx.fillStyle = '#ffd000';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Render Kumkum
  kumkumMarks.forEach(m => {
    ctx.fillStyle = '#d90429';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Render Flowers
  flowers.forEach(f => {
    ctx.font = '24px serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.type, f.x, f.y);
  });

  // Render Agarbathi Smoke Effect
  if (isAgarbathiLit) {
    if (Math.random() < 0.6) {
      smokeParticles.push({ x: 380, y: 440, vx: (Math.random() - 0.5) * 0.8, vy: -1.5, alpha: 0.6 });
    }
    
    // Draw Agarbathi Stand
    ctx.fillStyle = '#7f5539';
    ctx.fillRect(375, 450, 10, 30);
    ctx.fillStyle = '#d90429';
    ctx.fillRect(379, 440, 2, 10); // Burning tip
  }

  smokeParticles.forEach((p, index) => {
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.008;
    ctx.fillStyle = `rgba(220, 220, 220, ${p.alpha})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.random() * 4 + 2, 0, Math.PI * 2);
    ctx.fill();

    if (p.alpha <= 0) smokeParticles.splice(index, 1);
  });

  // Render Broken Coconut
  if (isCoconutOffered) {
    ctx.font = '32px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🥥', 180, 460);
    ctx.fillText('🥥', 210, 460); // Two coconut halves
  }
}

function drawThaliUI() {
  // Bottom Pooja Plate (Thali)
  ctx.fillStyle = '#ffb703';
  ctx.beginPath();
  ctx.ellipse(canvas.width / 2, 610, 240, 50, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#7a5200';
  ctx.beginPath();
  ctx.ellipse(canvas.width / 2, 610, 230, 42, 0, 0, Math.PI * 2);
  ctx.fill();

  // Draw Items on Thali
  tools.forEach(tool => {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.beginPath();
    ctx.arc(tool.x, tool.y, tool.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tool.icon, tool.x, tool.y);

    ctx.fillStyle = '#ffb703';
    ctx.font = '12px Georgia';
    ctx.fillText(tool.name, tool.x, tool.y + 36);
  });

  // Dragging active item icon
  if (isDragging && activeItem) {
    const selected = tools.find(t => t.id === activeItem);
    ctx.font = '36px serif';
    ctx.fillText(selected.icon, mouseX, mouseY);
  }

  // Blessings Screen Banner
  if (poojaComplete) {
    ctx.fillStyle = 'rgba(18, 0, 6, 0.75)';
    ctx.fillRect(0, 0, canvas.width, 70);

    ctx.fillStyle = '#ffd000';
    ctx.font = 'bold 20px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText('✨ Pooja Complete! May God Bless You With Peace & Prosperity ✨', canvas.width / 2, 42);
  }
}

function loop() {
  drawBackground();
  drawIdol();
  drawOfferings();
  drawThaliUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
